<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141315">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BINO">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>bino schedule</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23141315'/><circle cx='26' cy='34' r='14' fill='%23D8DD80'/><circle cx='40' cy='28' r='12' fill='%23DA95AA'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="day">
  <header class="top">
    <div class="brandrow">
      <p class="wordmark"><span class="w1">bino</span><span class="w2">schedule</span></p>
      <div class="viewtoggle" role="group" aria-label="Chế độ xem">
        <button id="viewDay" aria-pressed="true">Ngày</button>
        <button id="viewWeek" aria-pressed="false">Tuần</button>
      </div>
      <button id="menuBtn" class="iconbtn" aria-label="Tùy chọn khác">&#8943;</button>
    </div>
    <div class="titlerow">
      <div>
        <h1 id="monthLabel">Tháng</h1>
        <p class="sub" id="weekSub"></p>
      </div>
      <div class="nav">
        <button id="prev" class="iconbtn" aria-label="Tuần trước">&#8249;</button>
        <button id="today" class="pill">Hôm nay</button>
        <button id="next" class="iconbtn" aria-label="Tuần sau">&#8250;</button>
      </div>
    </div>
    <div class="hours" aria-live="polite">
      <p><span class="hnum" id="heroDone">0h</span><span class="hplan" id="heroPlan"></span></p>
      <div class="htrack"><div class="hfill" id="heroFill"></div></div>
    </div>
  </header>

  <nav class="strip" id="strip" aria-label="Các ngày trong tuần"></nav>
  <div class="legend" id="chips" aria-label="Lọc lịch"></div>
  <main id="board"></main>
  <section class="summary" id="summary" aria-label="Tổng kết tuần"></section>

  <button id="fab" class="fab" aria-label="Thêm lịch hoặc việc cần làm">+</button>

  <dialog id="dlg" class="sheet" aria-labelledby="dlgTitle"><div class="sheet-body" id="dlgBody"></div></dialog>

  <dialog id="menu" class="sheet" aria-labelledby="menuTitle">
    <div class="sheet-body">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sh-head plain">
        <h2 id="menuTitle">Tùy chọn</h2>
        <button class="close" data-mclose aria-label="Đóng">&times;</button>
      </div>
      <div class="seg" role="group" aria-label="Chế độ xem">
        <button data-mview="day" aria-pressed="true">Xem theo ngày</button>
        <button data-mview="week" aria-pressed="false">Xem cả tuần</button>
      </div>
      <button class="menuitem" id="btnIcs">Tải lịch .ics<span>8 tuần tới, nhắc trước 15 phút</span></button>
      <button class="menuitem" id="btnBackup">Sao lưu dữ liệu<span>Tick, ghi chú và lịch bạn tự thêm</span></button>
      <button class="menuitem" id="btnRestore">Khôi phục từ file sao lưu<span>Dùng khi đổi điện thoại hoặc trình duyệt</span></button>
      <input type="file" id="restoreFile" accept="application/json,.json" hidden>
      <p class="fine">Tick, ghi chú và lịch tự thêm đang được lưu trên thiết bị này.</p>
    </div>
  </dialog>

  <div class="ghost" id="ghost" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
